                <div class="form-row"><label class="cf-field"><span ar="اسم الجهة *" en="Organization name *"></span><span class="cf-input"><svg class="icon" aria-hidden="true"><use href="#building"/></svg><input name="org" type="text" required /></span></label><label class="cf-field"><span ar="اسم المسؤول *" en="Contact person *"></span><span class="cf-input"><svg class="icon" aria-hidden="true"><use href="#user"/></svg><input name="person" type="text" required autocomplete="name" /></span></label></div>
                <div class="cf-topics"><span class="cf-topics-label" ar="نوع الجهة" en="Organization type"></span>
                  <div class="cf-chips" role="radiogroup" ar-aria-label="نوع الجهة" en-aria-label="Organization type" aria-label="نوع الجهة">
                    <label class="cf-chip"><input type="radio" name="org_type" value="Hospitals" /><span ar="المستشفيات" en="Hospitals"></span></label>
                    <label class="cf-chip"><input type="radio" name="org_type" value="Health centers" /><span ar="المراكز الصحية" en="Health centers"></span></label>
                    <label class="cf-chip"><input type="radio" name="org_type" value="Academic institutions" /><span ar="الجهات الأكاديمية" en="Academic institutions"></span></label>
                    <label class="cf-chip"><input type="radio" name="org_type" value="Financial & administrative bodies" /><span ar="الجهات المالية والإدارية" en="Financial & administrative bodies"></span></label>
                  </div>
                </div>
              </fieldset>

              <fieldset class="reg-step">
                <legend><i aria-hidden="true">02</i><span ar="الاحتياج" en="Your needs"></span></legend>
                <div class="cf-topics"><span class="cf-topics-label" ar="المجالات المطلوبة * (يمكن اختيار أكثر من مجال)" en="Program areas * (choose one or more)"></span>
                  <div class="cf-chips org-area-chips" data-required-group>
                    <label class="cf-chip"><input type="checkbox" name="area" value="nursing" /><span><svg class="icon" aria-hidden="true"><use href="#steth"/></svg><span ar="التمريض" en="Nursing"></span></span></label>
                    <label class="cf-chip"><input type="checkbox" name="area" value="medical" /><span><svg class="icon" aria-hidden="true"><use href="#cross"/></svg><span ar="الطب" en="Medical"></span></span></label>
                    <label class="cf-chip"><input type="checkbox" name="area" value="emergency-medicine" /><span><svg class="icon" aria-hidden="true"><use href="#amb"/></svg><span ar="طب الطوارئ" en="Emergency Medicine"></span></span></label>
                    <label class="cf-chip"><input type="checkbox" name="area" value="management" /><span><svg class="icon" aria-hidden="true"><use href="#chart"/></svg><span ar="الإدارة والأعمال" en="Business &amp; Management"></span></span></label>
                    <label class="cf-chip"><input type="checkbox" name="area" value="research" /><span><svg class="icon" aria-hidden="true"><use href="#flask"/></svg><span ar="البحث العلمي" en="Research"></span></span></label>
                  </div>
                  <p class="org-area-error" role="alert" hidden ar="اختر مجالًا واحدًا على الأقل." en="Please choose at least one area."></p>
                </div>
                <label class="cf-field"><span ar="عدد المتدربين التقريبي" en="Approx. number of trainees"></span><span class="cf-input"><svg class="icon" aria-hidden="true"><use href="#users"/></svg><input name="size" type="number" min="1" inputmode="numeric" ar-placeholder="مثال: 25" en-placeholder="e.g. 25" placeholder="مثال: 25" /></span></label>
                <label class="cf-field"><span ar="ملاحظات أو تفاصيل إضافية" en="Notes or extra details"></span><textarea name="notes" rows="4" ar-placeholder="مثال: نحتاج برنامجًا للممرضين الجدد خلال الربع القادم…" en-placeholder="e.g. We need a program for new nurses next quarter…" placeholder="مثال: نحتاج برنامجًا للممرضين الجدد خلال الربع القادم…"></textarea></label>
              </fieldset>

              <fieldset class="reg-step">
                <legend><i aria-hidden="true">03</i><span ar="بيانات التواصل" en="Contact details"></span></legend>
                <div class="form-row"><label class="cf-field"><span ar="البريد الإلكتروني *" en="Email *"></span><span class="cf-input"><svg class="icon" aria-hidden="true"><use href="#mail"/></svg><input name="email" type="email" required autocomplete="email" dir="ltr" placeholder="name@organization.sa" /></span></label><label class="cf-field"><span ar="الجوال *" en="Mobile *"></span><span class="cf-input"><svg class="icon" aria-hidden="true"><use href="#phone"/></svg><input name="phone" type="tel" required autocomplete="tel" inputmode="tel" dir="ltr" placeholder="+966 5X XXX XXXX" /></span></label></div>
              </fieldset>

              <div class="cf-actions">
                <button class="btn" type="submit"><span class="btn-text" ar="أرسل الطلب" en="Send Request"></span><svg class="icon btn-arrow" aria-hidden="true"><use href="#send"/></svg></button>
              </div>
              <p class="form-success" role="status"><svg class="icon" aria-hidden="true"><use href="#check"/></svg><span ar="شكرًا لاهتمامك. سيتواصل معك فريقنا بتفاصيل المواعيد والتسجيل." en="Thank you for your interest. Our team will contact you with schedule and registration details."></span></p>
            </form>
          </div>

              <li><b ar="جلسة لفهم الاحتياج" en="A needs discovery session"></b><span ar="نتواصل معكم لفهم الأدوار وفجوات الأداء بدقة." en="We meet with you to understand roles and performance gaps precisely."></span></li>
              <li><b ar="نرسل عرضًا مخصصًا" en="We send a tailored proposal"></b><span ar="مقترح بالمحتوى والمدة وأسلوب التقديم المناسب لكم." en="A proposal covering content, duration, and the right delivery format."></span></li>
            </ol>
            <ul class="ci-list">
              <li><a class="ci-item" href="mailto:info@impactforge.sa"><span class="ci-icon"><svg class="icon" aria-hidden="true"><use href="#mail"/></svg></span><span class="ci-text"><small ar="تفضّل البريد؟" en="Prefer email?"></small><b dir="ltr">info@impactforge.sa</b></span><span class="ci-go"><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></span></a></li>
            </ul>
          </aside>
        </div>
      </section>
