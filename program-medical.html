            <h1 ar="برنامج إمباكت للتعزيز الطبي" en="Impact Medical Enhancement Program"></h1>
            <p class="page-hero-sub" ar="من مقاعد كلية الطب إلى الممارسة المهنية — ثلاثة مسارات في برنامج واحد." en="From medical school to professional practice — three tracks, one program."></p>

      <section>
        <div class="container program-detail" style="--ac: var(--p2)">
          <div class="program-detail-main">
          <section class="reveal pd-sec" id="pd-1"><h2 ar="نظرة عامة" en="Overview"></h2><p ar="برنامج إمباكت للتعزيز الطبي مبادرة تعليمية متعددة المسارات تدعم طلاب الطب والخريجين منذ سنواتهم الأكاديمية الأولى وحتى الممارسة المهنية. يجمع بين تدريب منظم عالي المردود في الإعداد للاختبارات، والتعليم الطبي الأساسي، والمهارات المتخصصة، بهدف سدّ الفجوة بين منهج كلية الطب ومتطلبات الممارسة الواقعية." en="The Impact Medical Enhancement Program is a multi-track initiative that supports medical students and graduates from their early academic years through professional practice. It combines structured, high-yield training in exam preparation, core medical education, and specialized skills to close the gap between the medical school curriculum and the demands of real-world practice."></p></section>
          <section class="reveal pd-sec" id="pd-2"><h2 ar="لمن البرنامج" en="Who it’s for"></h2><p ar="طلاب الطب في السنوات الأساسية والسريرية، أطباء الامتياز، والخريجون المستعدون للترخيص والتدريب بعد التخرج." en="Medical students in preclinical and clinical years, interns, and graduates preparing for licensing and postgraduate training."></p></section>
          <section class="reveal pd-sec" id="pd-3"><h2 ar="المسارات" en="Tracks"></h2><div class="services-grid"><div class="card"><h3 ar="الإعداد للترخيص والاختبارات" en="Licensing &amp; Exam Preparation"></h3><p ar="يُعدّ لاختبارات الترخيص والتأهيل الوطنية والدولية بمراجعة مركزة وأسئلة بنمط الاختبار واستراتيجيات الأداء، ويُصمّم كل مسار وفق معايير الجهة المنظّمة." en="Prepares candidates for national and international licensing and qualifying exams through focused review, exam-style practice, and test-taking strategy, each tailored to its examining body."></p></div><div class="card"><h3 ar="المبادرات الطبية الأساسية" en="Core Medical Initiatives"></h3><p ar="العلوم الأساسية: دورات مكثفة تحاكي منهج الكلية مع تدريس يربطها برعاية المرضى. العلوم السريرية: جولات سريرية عملية تبني مهارات الفحص وتهيّئ لاختبارات OSCE، ودورات معرفية تدعم التفكير السريري." en="Basic sciences: intensive courses mirroring the college curriculum, paired with clinically oriented teaching. Clinical sciences: hands-on rounds that build bedside skills and prepare for OSCEs, plus courses that support clinical reasoning."></p></div><div class="card"><h3 ar="الدورات الطبية المتخصصة" en="Specialized Medical Courses"></h3><p ar="تدريب عملي يتجاوز المنهج في الطب التشخيصي والإجرائي والتجميلي، يوسّع القدرات السريرية ويعزّز الثقة والجاهزية المهنية." en="Practical, skills-focused training in diagnostic, procedural, and aesthetic medicine that broadens clinical versatility and builds confidence and career readiness."></p></div></div></section>
          <section class="reveal pd-sec" id="pd-4"><h2 ar="أسئلة شائعة" en="FAQ"></h2><details class="faq-item"><summary ar="هل يُغني البرنامج عن المنهج الجامعي؟" en="Does it replace my curriculum?"></summary><p ar="لا، هو مكمّل يربط المنهج بالتطبيق والاختبارات." en="No, it complements it."></p></details><details class="faq-item"><summary ar="هل تضمنون اجتياز الاختبار؟" en="Do you guarantee a pass?"></summary><p ar="لا يمكن ضمان النتيجة، لكن التدريب مصمّم وفق صيغة كل اختبار ومعاييره." en="No result can be guaranteed; training follows each exam’s format and standards."></p></details></section>
          </div>
