        <div class="container program-detail" style="--ac: var(--p1)">
          <div class="program-detail-main">
          <section class="reveal pd-sec" id="pd-1"><h2 ar="نظرة عامة" en="Overview"></h2><p ar="تدعم برامج إمباكت لتعزيز كفاءات التمريض الممرضين والممرضات في مختلف مراحل مسيرتهم المهنية: الاستعداد للتوظيف، والجاهزية لأدوار جديدة، والحفاظ على مستوى الأداء، وبناء القدرات اللازمة للتقدم المهني. صُممت البرامج استجابةً لاحتياجات تعليمية محددة ومتطلبات التقييم في بيئة العمل، لتمنح المشاركين معارف ومهارات عملية وثقة يوظفونها في الممارسة السريرية الواقعية." en="The Impact Nurse Enhancement Programs support nurses at every stage of their careers: preparing for employment, getting ready for new roles, sustaining performance, and building the capabilities needed for advancement. Developed in response to identified learning needs and workplace evaluation requirements, they build knowledge, practical skills, and confidence that nurses apply in real clinical settings."></p></section>
          <section class="reveal pd-sec" id="pd-2"><h2 ar="لمن البرنامج" en="Who it’s for"></h2><div class="services-grid"><div class="card"><h3 ar="قبل التوظيف" en="Before employment"></h3><p ar="خريجو التمريض المستعدون للتوظيف وتقييمات القبول" en="Graduates preparing for employment and hiring assessments"></p></div><div class="card"><h3 ar="دور جديد" en="New role"></h3><p ar="ممرضون ينتقلون إلى قسم أو تخصص أو دور جديد" en="Nurses moving into a new unit, specialty, or role"></p></div><div class="card"><h3 ar="أثناء العمل" en="On the job"></h3><p ar="ممرضون ممارسون يستعدون لتقييمات الأداء والكفاءة" en="Practicing nurses preparing for performance and competency evaluations"></p></div><div class="card"><h3 ar="التقدم المهني" en="Career advancement"></h3><p ar="ممرضون يبنون مهارات الترقي والمسؤوليات الأعلى" en="Nurses building capabilities for promotion and wider responsibility"></p></div></div></section>
          <section class="reveal pd-sec" id="pd-3"><h2 ar="رحلة التعلّم" en="Learning Roadmap"></h2><div class="timeline"><i class="timeline-fill"></i><ol><li><span><b ar="جلسة تعريفية" en="Induction session"></b></span></li><li><span><b ar="محطات تقييم تكويني" en="Formative assessment stations"></b></span></li><li><span><b ar="اختبار نهائي" en="Final examination"></b></span></li></ol></div><p ar="تُكيَّف الأنشطة والتقييم حسب أهداف كل برنامج." en="Activities and assessments are tailored to each program’s objectives."></p></section>
          <section class="reveal pd-sec" id="pd-4"><h2 ar="الأثر" en="Why It Matters"></h2><div class="outcomes"><div class="card"><span class="icon-box"><svg class="icon" aria-hidden="true"><use href="#check"/></svg></span><p ar="ممارسة تمريضية أكثر أمانًا" en="Safer nursing practice"></p></div><div class="card"><span class="icon-box"><svg class="icon" aria-hidden="true"><use href="#check"/></svg></span><p ar="رعاية أكثر اتساقًا" en="More consistent care"></p></div><div class="card"><span class="icon-box"><svg class="icon" aria-hidden="true"><use href="#check"/></svg></span><p ar="تجربة أفضل للمريض" en="A better patient experience"></p></div></div></section>
          <section class="reveal pd-sec" id="pd-5"><h2 ar="أسئلة شائعة" en="FAQ"></h2><details class="faq-item"><summary ar="هل يناسبني البرنامج وأنا حديث التخرج؟" en="Is it suitable for new graduates?"></summary><p ar="نعم، توجد برامج مخصصة لمرحلة الاستعداد للتوظيف." en="Yes, some programs target employment readiness."></p></details><details class="faq-item"><summary ar="كيف يُقيَّم تقدمي؟" en="How is progress assessed?"></summary><p ar="عبر محطات تقييم تكويني ثم اختبار نهائي." en="Through formative stations and a final exam."></p></details></section>
