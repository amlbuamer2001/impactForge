      <section>
        <div class="container program-detail" style="--ac: var(--p4)">
          <div class="program-detail-main">
          <section class="reveal pd-sec" id="pd-1"><h2 ar="نظرة عامة" en="Overview"></h2><p ar="تقدّم برامج إمباكت لتعزيز المهارات الإدارية دورات قصيرة وشهادات مصغّرة (Microcredentials) مصمّمة وفق الاحتياجات التشغيلية الفعلية في الرعاية الصحية والمالية والموارد البشرية والإدارة الأكاديمية. تركّز على المهارات التطبيقية بدلًا من النظريات العامة، وتساعد المهنيين والمؤسسات على بناء قدرات جاهزة للعمل بسرعة." en="Impact Business &amp; Management Enhancement Programs deliver short courses and microcredentials built around the real operational needs of healthcare, finance, human resources, and academic administration. They focus on applied skills rather than broad theory, helping professionals and institutions quickly build job-ready capability."></p></section>
          <section class="reveal pd-sec" id="pd-2"><h2 ar="ما يميّزه" en="What sets it apart"></h2><div class="services-grid"><div class="card"><h3 ar="بناء حسب الحاجة" en="Tailored design"></h3><p ar="نحلّل الأدوار وسير العمل والمتطلبات التنظيمية وفجوات الأداء، ثم نصوغ المحتوى والمدة وأسلوب التقديم لكل سياق." en="We analyze roles, workflows, regulatory requirements, and performance gaps, then shape content, duration, and delivery for each context."></p></div><div class="card"><h3 ar="تعلّم بالتطبيق" en="Hands-on learning"></h3><p ar="دراسات حالة ومحاكاة ونماذج وأدوات، وينتهي كل برنامج بمخرج تطبيقي: خطة أو إجراء أو تقرير أو مسودة سياسة." en="Case studies, simulations, templates, and tools; every course ends with an applied output: a plan, process, report, or policy draft."></p></div><div class="card"><h3 ar="شهادات قابلة للتراكم" en="Stackable credentials"></h3><p ar="دورات مركّزة وشهادات مصغّرة تؤخذ منفردة أو ضمن مسار مهني أوسع، دون الانقطاع طويلًا عن العمل." en="Focused courses and microcredentials taken one at a time or combined into wider pathways, without long breaks from work."></p></div></div></section>
          <section class="reveal pd-sec" id="pd-3"><h2 ar="القطاعات" en="Sectors"></h2><div class="services-grid"><div class="card"><h3 ar="الرعاية الصحية" en="Healthcare"></h3><p ar="إدارة المنشآت بكفاءة، الجودة والامتثال، الإجراءات الإدارية للمرضى، إدارة الموارد." en="Running facilities efficiently, quality and compliance, patient-facing administration, resource management."></p></div><div class="card"><h3 ar="المالية" en="Finance"></h3><p ar="العمليات المالية، التقارير، الضوابط، الميزانيات، القرار المبني على المخاطر." en="Financial processes, reporting, controls, budgeting, risk-informed decisions."></p></div><div class="card"><h3 ar="الموارد البشرية" en="Human Resources"></h3><p ar="إدارة المواهب، سياسات القوى العاملة، علاقات الموظفين، أنظمة الأداء." en="Talent management, workforce policies, employee relations, performance systems."></p></div><div class="card"><h3 ar="الإدارة الأكاديمية" en="Academic Administration"></h3><p ar="إدارة المؤسسات، دعم الطلبة، الحوكمة الأكاديمية، ضمان الجودة." en="Institutional operations, student support, academic governance, quality assurance."></p></div></div></section>
          </div>
