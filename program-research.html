            <h1 ar="برنامج إمباكت لتعزيز البحث العلمي" en="Impact Research Enhancement Program"></h1>
            <p class="page-hero-sub" ar="من الفكرة الأولى إلى المقال المنشور — نرافقك في كل مرحلة من بحثك." en="From first idea to published article — support at every stage of your research."></p>
            <div class="actions"><a class="btn" href="register.html?program=research" ><span class="btn-text" ar="ابدأ مشروعك البحثي" en="Start Your Research Project"></span><svg class="icon btn-arrow" aria-hidden="true"><use href="#arrow"/></svg></a></div>

      <section>
        <div class="container program-detail no-aside" style="--ac: var(--p5)">
          <div class="program-detail-main">
          <section class="reveal"><h2 ar="نظرة عامة" en="Overview"></h2><p ar="برنامج إمباكت لتعزيز البحث العلمي برنامج دعم أكاديمي ومهني للبحث الطبي والأكاديمي. يرافق الطلبة والأطباء والباحثين من الفكرة الأولى حتى نشر المقال العلمي، عبر التدريب المتخصص والإرشاد الشخصي والدعم الفني التطبيقي، لإنتاج بحوث رصينة وأخلاقية وقابلة للنشر." en="The Impact Research Enhancement Program is an academic and professional support program for medical and academic research. It guides students, clinicians, and researchers from initial idea to published article through expert training, personalized mentorship, and hands-on technical support, helping them produce rigorous, ethical, and publishable research."></p></section>
          <section class="reveal"><h2 ar="لمن البرنامج" en="Who it’s for"></h2><p ar="طلبة العلوم الصحية والدراسات العليا، والأطباء والممارسون الصحيون، والباحثون الأكاديميون." en="Health sciences and postgraduate students, clinicians and health practitioners, and academic researchers."></p></section>
          <section class="reveal"><h2 ar="مجالات الدعم" en="Support Areas"></h2><div class="timeline"><i class="timeline-fill"></i><ol><li><span><b ar="الفكرة والمقترح" en="Idea &amp; Proposal"></b><p ar="صياغة الأهداف والأسئلة، اختيار تصميم الدراسة والمنهجية، إعداد البروتوكول وأدوات جمع البيانات." en="Refining objectives and questions, choosing study design and methodology, developing protocols and data collection tools."></p></span></li><li><span><b ar="التدريب البحثي" en="Research Training"></b><p ar="أساسيات البحث الطبي، تصميم الدراسات، البحث في الأدبيات، التقييم النقدي، كتابة المقترحات والمخطوطات." en="Research fundamentals, study design, literature searching, critical appraisal, proposal and manuscript writing."></p></span></li><li><span><b ar="الإرشاد والإشراف" en="Mentorship"></b><p ar="توجيه فردي، مراجعات دورية للتقدم، متابعة مستمرة تناسب كل مشروع." en="One-to-one guidance, regular progress reviews, ongoing follow-up."></p></span></li><li><span><b ar="الإحصاء الحيوي" en="Biostatistics"></b><p ar="تجهيز البيانات، خطة التحليل، التحليل باستخدام Stata، تفسير النتائج، جداول وأشكال واضحة." en="Data preparation, analysis planning, analysis in Stata, interpretation, clear tables and figures."></p></span></li><li><span><b ar="المراجعات المنهجية" en="Systematic Reviews"></b><p ar="استراتيجيات البحث، استخلاص البيانات، تقييم الجودة، التحليل التلوي، التقارير وفق PRISMA." en="Search strategies, data extraction, quality assessment, meta-analysis, PRISMA-compliant reporting."></p></span></li><li><span><b ar="الكتابة العلمية" en="Scientific Writing"></b><p ar="مراجعة وتحرير المقترحات والمخطوطات والرسائل: اللغة، الملخصات، خطابات التقديم، المراجع." en="Review and editing of proposals, manuscripts, theses: language, abstracts, cover letters, references."></p></span></li><li><span><b ar="دعم النشر" en="Publication Support"></b><p ar="اختيار المجلة، إعداد التقديم، الرد على المحكّمين، تعديل المخطوطة، أخلاقيات النشر." en="Journal selection, submission, reviewer responses, revision, publication ethics."></p></span></li></ol></div></section>
          <section class="reveal"><h2 ar="النزاهة العلمية" en="Scientific Integrity"></h2><div class="notice"><svg class="icon" aria-hidden="true"><use href="#info"/></svg><span ar="ندعم الباحث في بناء بحثه ومراجعته وترشيده، ويبقى العمل والمؤلفية للباحث. ولا نضمن قبول النشر، لأن القرار للمجلة المحكّمة." en="We support researchers in building, reviewing, and refining their work; the work and authorship remain theirs. We do not guarantee acceptance, which rests with the peer-reviewed journal."></span></div></section>
          </div>
