      <section id="story">
        <div class="container">
          <div class="scrub-text reveal" style="font-size: clamp(1.15rem, 2vw, 1.5rem); font-weight: 600; line-height: 1.9; max-width: 980px"><p ar="إمباكتفورج القابضة محرّك وطني رائد يُسهم في تحفيز الابتكار الصحي وتنمية الكوادر البشرية، ننطلق من قلب المملكة العربية السعودية. واستنادًا إلى مستهدفات رؤية السعودية 2030، نعمل على تمكين قطاع الرعاية الصحية في المملكة عبر إعداد كفاءات وطنية مؤهلة للمستقبل في مجالات الممارسة الطبية، والإدارة الصحية، والتخطيط الاستراتيجي، والإدارة المالية الصحية. ومن خلال شراكات استراتيجية عالمية، نحرص على تحويل أحدث الأبحاث الإنسانية إلى حلول عملية قابلة للتوسع، تعزّز كفاءة الأنظمة الصحية محليًا وعالميًا." en="Impact Forge Holding is a Saudi-rooted catalyst for health innovation and workforce development. Aligned with Saudi Vision 2030, we empower the Kingdom’s healthcare sector by cultivating future-ready national talent across medical practice, health administration, strategic management, and healthcare finance. Through strategic global partnerships, we translate cutting-edge humanitarian research into practical, scalable solutions that strengthen health systems locally and globally."></p></div>
        </div>
      </section>

            <div>
              <blockquote><p ar="بصفتي مستشارةً تنفيذيةً لشركة إمباكتفورج القابضة، حيث نضع الإنسان في صميم اهتمامنا، ألمس فعليًا كيف تنبثق رسالتنا وقيمنا وأهدافنا مباشرةً من «رؤية المملكة 2030» التي جعلت الإنسان محورها. فنحن لا نكتفي بتقديم برامج تدريبية فحسب، بل نعمل على تمكين الكفاءات السعودية لقيادة مستقبل القطاع الصحي والطبي." en="As Executive Advisor at Impact Forge Holding — where we place people at the very heart of our focus — I witness firsthand how our mission, values, and objectives stem directly from Saudi Vision 2030, a vision centered on the human element. We go beyond offering training programs; we empower Saudi talent to lead the future of the health and medical sectors."></p><p ar="ولأن تعزيز سلامة المرضى والارتقاء بجودة الخدمات ركيزتان أساسيتان في الرؤية، فإننا نمدّ جسور التعاون أيضًا مع المتخصصين في الرعاية الصحية على المستويين المحلي والدولي. هدفنا واضح: سدّ الفجوة بين الإمكانات والكفاءة بمستويات عالمية." en="Because enhancing patient safety and elevating service quality are fundamental pillars of Vision 2030, we also build bridges of collaboration with healthcare professionals locally and internationally. Our objective is clear: to bridge the gap between potential and world-class competence."></p><p ar="وانطلاقًا من قيم التميّز والتمكين والأثر، نستثمر في برامج تعليمية عملية تُعدّ الكوادر الصحية لمواجهة التحديات السريرية الواقعية. ومن خلال بناء قيادات سعودية متمكّنة وكوادر عاملة عالية المهارة، نسهم اليوم في بناء مجتمع أكثر صحةً للمستقبل." en="Guided by our values of excellence, empowerment, and impact, we invest in practical, hands-on educational programs that prepare healthcare professionals for real-world clinical challenges. By cultivating capable Saudi leaders alongside a highly skilled workforce, we are contributing today to a healthier community for the future."></p></blockquote>
              <div class="message-author"><b ar="صاحبة السمو الملكي الأميرة نجود بنت هذلول بن عبدالعزيز" en="HRH Princess Nujoud bint Hathloul bin Abdulaziz"></b><small ar="المستشارة التنفيذية" en="Executive Advisor"></small></div>
