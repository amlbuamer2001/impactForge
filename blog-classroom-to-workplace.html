            <h1 class="blog-post-title" ar="من مقاعد الدراسة إلى بيئة العمل: كيف تسدّ الفجوة بين المعرفة والممارسة؟" en="From classroom to workplace: closing the gap between knowledge and practice"></h1>
          </div>
        </div>
      </section>

      <section class="blog-post">
        <div class="container blog-post-layout">
          <!-- محتوى المقال: نص إرشادي عام — راجعيه قبل النشر -->
          <article class="blog-post-article">
            <figure class="blog-post-cover">
              <img src="assets/images/01_training.jpg" alt="" />
            </figure>

            <div class="blog-post-body">
              <p class="blog-post-lead" ar="يتخرّج كثير من الممارسين الصحيين وهم يحملون معرفة نظرية قوية، ثم يكتشفون في أول أيام العمل أن بيئة المستشفى تطلب شيئًا مختلفًا: قرارات أسرع، وتواصلًا مستمرًا مع الفريق، ومسؤولية مباشرة عن المريض. هذه الفجوة طبيعية، والخبر الجيد أنها قابلة للسدّ بخطوات واضحة." en="Many health graduates leave with strong theoretical knowledge, then discover in their first days at work that the hospital demands something different: faster decisions, constant team communication, and direct responsibility for patients. The gap is normal — and it can be closed with clear steps."></p>

              <section class="blog-post-section" id="why-gap">
                <h2><span class="blog-post-num" aria-hidden="true">01</span><span ar="لماذا يشعر الخريج بالفجوة؟" en="Why graduates feel the gap"></span></h2>
                <p ar="المناهج الأكاديمية تبني الأساس العلمي، لكن الممارسة اليومية تعتمد على مهارات لا تُكتسب إلا بالتطبيق المتكرر تحت إشراف." en="Academic curricula build the scientific foundation, but daily practice relies on skills that only come from repeated, supervised application."></p>
                <ul class="blog-post-list"><li ar="التعامل مع حالات حقيقية متغيّرة لا تشبه أمثلة الكتب دائمًا." en="Handling real, changing cases that don’t always match textbook examples."></li><li ar="اتخاذ القرار تحت ضغط الوقت وتعدّد المهام." en="Making decisions under time pressure and competing tasks."></li><li ar="التواصل الواضح مع الزملاء والمرضى وذويهم." en="Communicating clearly with colleagues, patients, and families."></li></ul>
              </section>

              <section class="blog-post-section" id="steps">
                <h2><span class="blog-post-num" aria-hidden="true">02</span><span ar="خمس خطوات عملية لسدّ الفجوة" en="Five practical steps to close it"></span></h2>
                <ol class="blog-post-steps">
                  <li><b ar="حدّد فجواتك بصدق" en="Name your gaps honestly"></b><span ar="اكتب المهارات التي تشعر أنها الأضعف لديك، وابدأ بها." en="List the skills you feel weakest in, and start there."></span></li>
                  <li><b ar="تدرّب بالمحاكاة قبل الواقع" en="Practise in simulation first"></b><span ar="السيناريوهات المحاكية تمنحك مساحة آمنة للخطأ والتعلّم منه." en="Simulated scenarios give you a safe space to make mistakes and learn."></span></li>
                  <li><b ar="اطلب التغذية الراجعة باستمرار" en="Ask for feedback constantly"></b><span ar="ملاحظات المشرفين والزملاء أسرع طريق لتصحيح المسار." en="Feedback from supervisors and peers is the fastest way to correct course."></span></li>
                  <li><b ar="اربط كل معلومة بموقف عملي" en="Tie every concept to a real situation"></b><span ar="اسأل نفسك: متى سأحتاج هذا في المناوبة؟" en="Ask yourself: when will I need this on shift?"></span></li>
                  <li><b ar="ابنِ عادة التعلّم المستمر" en="Build a habit of continuous learning"></b><span ar="خصّص وقتًا ثابتًا أسبوعيًا للمراجعة وتطوير المهارات." en="Set a fixed weekly time for review and skill building."></span></li>
                </ol>
                <blockquote class="blog-post-quote"><p ar="المعرفة تجعلك مؤهّلًا، والممارسة تجعلك جاهزًا." en="Knowledge makes you qualified; practice makes you ready."></p></blockquote>
              </section>

              <section class="blog-post-section" id="applied">
                <h2><span class="blog-post-num" aria-hidden="true">03</span><span ar="دور التدريب التطبيقي" en="The role of applied training"></span></h2>
                <p ar="التدريب التطبيقي يضعك أمام مواقف تشبه بيئة العمل الفعلية: دراسات حالة، ومحاكاة، وجولات سريرية بإشراف مختصين. الهدف ليس حفظ المزيد من المعلومات، بل بناء الثقة في استخدامها في اللحظة المناسبة." en="Applied training puts you in situations that mirror the real workplace: case studies, simulation, and supervised clinical rounds. The goal isn’t memorising more — it’s building confidence to use what you know at the right moment."></p>
                <p ar="وكلما كان التدريب مصمَّمًا حسب احتياج تخصصك ومرحلتك المهنية، كان أثره أوضح وأسرع." en="And the more the training is tailored to your specialty and career stage, the clearer and faster its impact."></p>
              </section>

              <section class="blog-post-section" id="progress">
                <h2><span class="blog-post-num" aria-hidden="true">04</span><span ar="كيف تقيس تقدّمك؟" en="How to measure your progress"></span></h2>
                <p ar="التقدّم الحقيقي يُقاس بما تستطيع فعله، لا بعدد الساعات التي قضيتها. راقب مؤشرات بسيطة:" en="Real progress is measured by what you can do, not by hours spent. Watch a few simple signals:"></p>
                <ul class="blog-post-list"><li ar="هل أصبحت قراراتك أسرع وأكثر ثقة؟" en="Are your decisions faster and more confident?"></li><li ar="هل تقلّ الأخطاء المتكررة مع الوقت؟" en="Are repeated mistakes decreasing over time?"></li><li ar="هل تشعر براحة أكبر في التواصل مع الفريق؟" en="Do you feel more at ease communicating with the team?"></li></ul>
              </section>

              <section class="blog-post-section blog-post-summary" id="summary">
                <h2><span class="blog-post-num" aria-hidden="true">05</span><span ar="الخلاصة" en="Key takeaways"></span></h2>
                <ul><li ar="الفجوة بين الدراسة والعمل طبيعية ويمكن سدّها." en="The gap between study and work is normal — and closable."></li><li ar="الممارسة المتكررة والتغذية الراجعة أهم أدواتك." en="Repeated practice and feedback are your most important tools."></li><li ar="التدريب التطبيقي المصمَّم لتخصصك يختصر الطريق." en="Applied training built for your specialty shortens the journey."></li></ul>
              </section>
            </div>
